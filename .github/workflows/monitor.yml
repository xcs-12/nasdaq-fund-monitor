name: Nasdaq limits
on:
  schedule:
    - cron: '10 1 * * *'
    - cron: '30 6 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      test_mail:
        description: '仅发送一封明确标注的测试邮件'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nasdaq-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      WATCH_STATE_DIR: ${{ github.workspace }}/runtime
      WATCH_WEB_DIR: ${{ github.workspace }}/web/data
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=optional --ignore-scripts
      - name: Restore persistent state
        run: node scripts/watch/state-branch.js restore
      - name: Check public sources
        id: check
        if: ${{ !inputs.test_mail }}
        continue-on-error: true
        run: node scripts/watch/run.js check
      - name: Persist baseline and outbox before sending
        if: ${{ !inputs.test_mail }}
        run: node scripts/watch/state-branch.js save
      - name: Export latest public data
        if: ${{ !inputs.test_mail }}
        run: node scripts/watch/run.js export
      - uses: actions/configure-pages@v5
        if: ${{ !inputs.test_mail }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.test_mail }}
        with:
          path: web
      - name: Deploy public dashboard
        id: deploy
        if: ${{ !inputs.test_mail }}
        uses: actions/deploy-pages@v4
      - name: Send SMTP mail
        id: mail
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
          TEST_MAIL: ${{ inputs.test_mail }}
        run: |
          if [ "$TEST_MAIL" = "true" ]; then
            node scripts/watch/run.js test-mail
          else
            node scripts/watch/run.js send
          fi
      - name: Persist mail outcome
        if: ${{ always() && !cancelled() && !inputs.test_mail }}
        run: node scripts/watch/state-branch.js save
      - name: Report failures
        if: ${{ always() && (steps.check.outcome == 'failure' || steps.mail.outcome == 'failure') }}
        run: exit 1
